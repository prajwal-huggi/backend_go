services:
  backend:
    build: .
    container_name: backend_go

    ports:
      - "8080:8080"

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: go_postgres_container

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
